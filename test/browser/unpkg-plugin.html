<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>browser test</title>
    <style>
        html,
        body {
            margin: 0;
        }

        #blocklyDiv {
            height: 100vh;
            width: 100vw;
        }
    </style>
    <script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
    <script src="../../dist/multiselect.js"></script>
</head>

<body>
    <div id="blocklyDiv"></div>

    <script>
        function createWorkspace(blocklyDiv, options) {
            const optionsMgr = multiselect.OptionsMgr.getInstance()
            optionsMgr.setOptions({
                copyPasteToStorage: true,
                copyPasteToClipboard: true,
                hideDisabledMenuItems: false,
                enableBlockMenu: true,
                blockScope: {
                    // movable: true,
                },
                enableWorkspaceMenu: true,
                workspaceScope: {
                    // select: false,
                },
                multiselectScope: {
                    // redo: true,
                },
            });
            const workspace = Blockly.inject(blocklyDiv, options); // hardcoded blocklyDiv
            const plugin = new multiselect.MultiselectPlugin(workspace);
            window.MultiselectPlugin = plugin;
            plugin.init();

            return workspace;
        }

        document.addEventListener("DOMContentLoaded", function () {
            const toolbox = {
                "kind": "flyoutToolbox",
                "contents": [
                    {
                        "kind": "block",
                        "type": "controls_if"
                    },
                    {
                        "kind": "block",
                        "type": "controls_whileUntil"
                    }
                ]
            };

            createWorkspace(document.getElementById("blocklyDiv"), {
                toolbox: toolbox,
            });
        });
    </script>
</body>

</html>
